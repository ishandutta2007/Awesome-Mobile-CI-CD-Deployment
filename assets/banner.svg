<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%" style="background:#0a0f1d; border-radius:12px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <linearGradient id="accent-text" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>

    <radialGradient id="glow-cyan" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes flowAnimation {
        from { stroke-dashoffset: 240; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes drift {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes pulseNode {
        0%, 100% { r: 6px; opacity: 0.8; }
        50% { r: 9px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
      .pipeline-line {
        stroke-dasharray: 12 8;
        animation: flowAnimation 8s linear infinite;
      }
      .floating-item {
        animation: drift 6s ease-in-out infinite;
      }
      .pulsing-dot {
        animation: pulseNode 3s ease-in-out infinite;
      }
      .badge-glow {
        animation: pulseGlow 4s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="12" />
  <rect width="100%" height="100%" fill="url(#glow-cyan)" rx="12" />
  <rect width="100%" height="100%" fill="url(#glow-purple)" rx="12" />

  <!-- Subtle Decorative Grid Background -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Animated Pipeline Flow in Background (Lower section, non-intrusive) -->
  <g opacity="0.45">
    <path class="pipeline-line" d="M 60 300 Q 300 280, 600 300 T 1140 300" fill="none" stroke="url(#line-grad)" stroke-width="3" />
    <!-- Pipeline Stage Nodes -->
    <circle cx="160" cy="295" class="pulsing-dot" fill="#38bdf8" />
    <circle cx="400" cy="290" class="pulsing-dot" fill="#60a5fa" style="animation-delay: 0.6s;" />
    <circle cx="640" cy="300" class="pulsing-dot" fill="#818cf8" style="animation-delay: 1.2s;" />
    <circle cx="880" cy="295" class="pulsing-dot" fill="#a855f7" style="animation-delay: 1.8s;" />
    <circle cx="1060" cy="300" class="pulsing-dot" fill="#c084fc" style="animation-delay: 2.4s;" />
  </g>

  <!-- Top Pill / Badge -->
  <g class="floating-item" transform="translate(60, 40)">
    <rect width="320" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="18" cy="16" r="5" fill="#10b981" class="badge-glow" />
    <text x="32" y="21" fill="#94a3b8" font-size="12" font-weight="600" letter-spacing="1">CURATED MOBILE DEVOPS ECOSYSTEM</text>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(60, 130)">
    <!-- Primary Title -->
    <text x="0" y="0" font-size="44" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome Mobile <tspan fill="url(#accent-text)">CI/CD &amp; Deployment</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="38" font-size="19" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Curated guide to SaaS platforms, macOS runners, iOS code signing, &amp; open-source automation
    </text>
  </g>

  <!-- Feature Tags / Pills (Foreground, neatly spaced) -->
  <g transform="translate(60, 215)">
    <!-- Pill 1: iOS & Android -->
    <g transform="translate(0, 0)">
      <rect width="165" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#3b82f6" stroke-width="1" />
      <text x="82" y="22" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">📱 iOS &amp; Android</text>
    </g>

    <!-- Pill 2: Apple Silicon CI -->
    <g transform="translate(180, 0)">
      <rect width="185" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1" />
      <text x="92" y="22" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">🍏 Apple Silicon M4/M2</text>
    </g>

    <!-- Pill 3: Fastlane Match -->
    <g transform="translate(380, 0)">
      <rect width="175" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#8b5cf6" stroke-width="1" />
      <text x="87" y="22" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">🔐 Fastlane Match</text>
    </g>

    <!-- Pill 4: TestFlight & Play Store -->
    <g transform="translate(570, 0)">
      <rect width="195" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#ec4899" stroke-width="1" />
      <text x="97" y="22" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">🚀 Automated Release</text>
    </g>

    <!-- Pill 5: Cloud & Self-Hosted -->
    <g transform="translate(780, 0)">
      <rect width="185" height="36" rx="8" fill="#1e293b" fill-opacity="0.9" stroke="#10b981" stroke-width="1" />
      <text x="92" y="22" fill="#e2e8f0" font-size="13" font-weight="600" text-anchor="middle">⚡ Cloud &amp; Self-Hosted</text>
    </g>
  </g>
</svg>
